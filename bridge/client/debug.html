<!DOCTYPE html>
<!-- DART network debug view: one page = one node on the mesh, through the bridge.
     Discovers every peer and topic, auto-joins each topic (adopting its advertised
     schema), decodes live traffic, and publishes to any topic from a per-field form.
     ES modules do not load over file://, so serve this directory and open it:
         dart_bridge --verbose
         python -m http.server 8000 -d bridge/client     (or: npx serve bridge/client)
         http://localhost:8000/debug.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DART debug</title>
<style>
  /* design tokens = the explorer's UI_DARK palette (explore/ui_theme.h) */
  :root {
    --bg: #141416; --panel: #1b1b1e; --panel2: #212125; --panel3: #28282d;
    --border: #2a2a2f; --border2: #383840; --code-bg: #131315;
    --text: #ededee; --dim: #9a9aa0; --faint: #64646b;
    --accent: #4db6ac; --accent-bg: rgba(77,182,172,.15);
    --green: #46ae64;  --green-bg: rgba(70,174,100,.14);
    --amber: #cf9a3a;  --amber-bg: rgba(207,154,58,.15);
    --red:   #d2574b;  --red-bg:   rgba(210,87,75,.16);
    --gray:  #74747c;  --gray-bg:  rgba(116,116,124,.18);
    --mono: ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13.5px/1.45 system-ui, sans-serif; }

  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
           border-bottom: 1px solid var(--border); background: var(--panel);
           position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 14px; font-weight: 650; letter-spacing: .3px; margin-right: 6px; }
  header h1 span { color: var(--accent); }
  #url { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
         border-radius: 5px; padding: 0 9px; height: 30px; font-family: var(--mono);
         font-size: 12px; width: 210px; }
  #url:focus, .addbar input:focus, .form input:focus { outline: none; border-color: var(--border2); }
  button { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--border);
           border-radius: 5px; height: 30px; padding: 0 12px; font-weight: 600;
           font-size: 12.5px; cursor: pointer; }
  button:hover { border-color: var(--border2); }
  button.ghost { background: var(--panel2); color: var(--text); }
  #status { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  #status i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--faint);
              background: transparent; display: inline-block; }
  #status.on i { background: var(--green); border-color: var(--green); }
  #nodename { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  #stats { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); }

  main { display: grid; grid-template-columns: 300px 1fr; gap: 10px; padding: 10px 14px;
         align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
  section > h2 { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;
                 color: var(--faint); padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .empty { color: var(--faint); font-size: 12.5px; padding: 14px 12px; text-align: center; }

  /* peers */
  .peer { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .peer:last-child { border-bottom: 0; }
  .peer .row1 { display: flex; align-items: center; gap: 8px; }
  .peer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
  .peer.dropped .dot { background: transparent; border: 1px solid var(--faint); }
  .peer .pname { font-weight: 600; font-size: 13px; }
  .peer .meta { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2);
          border: 1px solid var(--border); border-radius: 4px; padding: 2px 9px;
          font-family: var(--mono); font-size: 11px; color: var(--text); }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .chip.sub i { background: transparent; border: 1px solid var(--faint); }

  /* topics */
  .topic { border-bottom: 1px solid var(--border); }
  .topic:last-child { border-bottom: 0; }
  .thead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
  .tname { font-weight: 600; font-size: 14px; }
  .badge { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 4px;
           background: var(--gray-bg); color: var(--gray); }
  .badge.typed { background: var(--accent-bg); color: var(--accent); }
  .badge.rel { background: var(--green-bg); color: var(--green); }
  .badge.fail { background: var(--red-bg); color: var(--red); }
  .trate { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .tlast { font-family: var(--mono); font-size: 12px; color: var(--text); margin: 0 12px 8px;
           padding: 5px 8px; background: var(--code-bg); border-radius: 4px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tlast .from { color: var(--faint); }
  details { padding: 0 12px 8px; }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px; user-select: none; }
  details summary:hover { color: var(--text); }
  details[open] summary { color: var(--accent); }
  .schema { font-family: var(--mono); font-size: 11.5px; margin: 6px 0; border-collapse: collapse; }
  .schema td { padding: 1px 12px 1px 0; color: var(--faint); }
  .schema td:first-child { color: var(--text); }
  .schema td:nth-child(2) { color: var(--dim); }
  .form { display: grid; grid-template-columns: max-content 1fr; gap: 4px 8px; margin: 8px 0 4px;
          max-width: 560px; align-items: center; }
  .form label { font-family: var(--mono); font-size: 11.5px; color: var(--dim); text-align: right; }
  .form input[type=text] { background: var(--panel2); border: 1px solid var(--border);
          color: var(--text); border-radius: 4px; padding: 3px 8px;
          font-family: var(--mono); font-size: 12px; width: 100%; }
  .form .send { grid-column: 2; justify-self: start; margin-top: 4px; height: 26px; padding: 0 14px; }
  .addbar { display: flex; gap: 6px; padding: 9px 12px; }
  .addbar input { flex: 1; background: var(--panel2); border: 1px solid var(--border);
                  color: var(--text); border-radius: 5px; padding: 0 9px; height: 30px;
                  font-family: var(--mono); font-size: 12px; }

  /* feed + log */
  #bottom { grid-column: 1 / -1; display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  @media (max-width: 900px) { #bottom { grid-template-columns: 1fr; } }
  .scroll { max-height: 300px; overflow-y: auto; font-family: var(--mono); font-size: 11.5px;
            background: var(--code-bg); border-radius: 0 0 6px 6px; }
  .frow { display: flex; gap: 10px; padding: 2px 12px; border-bottom: 1px solid var(--panel); }
  .frow .t { color: var(--faint); flex: none; }
  .frow .top { color: var(--accent); flex: none; min-width: 70px; }
  .frow .who { color: var(--green); flex: none; }
  .frow .body { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow.ev .body { color: var(--amber); }
</style>
</head>
<body>

<header>
  <h1>DART <span>debug</span></h1>
  <input id="url" value="ws://127.0.0.1:7480" spellcheck="false">
  <button id="connect">connect</button>
  <span id="status"><i></i><span id="stext">disconnected</span></span>
  <span id="nodename"></span>
  <span id="stats"></span>
</header>

<main>
  <section id="peers-sec">
    <h2>Peers</h2>
    <div id="peers"><div class="empty">not connected</div></div>
  </section>

  <section id="topics-sec">
    <h2>Topics (auto-joined, adopting advertised schemas)</h2>
    <div id="topics"><div class="empty">no topics discovered yet</div></div>
    <div class="addbar">
      <input id="addname" placeholder="join a topic by name (raw unless a peer advertises a schema)">
      <button id="addbtn" class="ghost">join</button>
    </div>
  </section>

  <div id="bottom">
    <section>
      <h2>Message feed</h2>
      <div id="feed" class="scroll"><div class="empty">nothing received</div></div>
    </section>
    <section>
      <h2>Events</h2>
      <div id="log" class="scroll"><div class="empty">no events</div></div>
    </section>
  </div>
</main>

<script type="module">
/* Import the client; some servers (python http.server on Windows) serve .mjs as
 * text/plain, which strict module MIME checking rejects, so fall back to fetching the
 * source and importing it as a Blob with the right type. */
async function loadClient() {
    try { return await import("./dart.mjs"); }
    catch {
        const src = await fetch("./dart.mjs").then((r) => r.text());
        return import(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    }
}
const { DartClient } = await loadClient();

const $ = (id) => document.getElementById(id);
let node = null;
let refreshTimer = null;

/* per-topic state: name -> { ch, joining, failed, info, els:{...}, count, times[], last } */
const topics = new Map();
const feed = [];   /* newest first, capped */
const logs = [];

/* ---- helpers ---------------------------------------------------------------------- */

const now = () => new Date().toTimeString().slice(0, 8);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hex = (b, n = 24) =>
    [...b.subarray(0, n)].map((x) => x.toString(16).padStart(2, "0")).join(" ") + (b.length > n ? " …" : "");

function summarize(ch, m) {
    if (!ch.fields.size) return `${m.data.length} B  ${hex(m.data)}`;
    const parts = [];
    for (const f of ch.fields.values()) {
        if (f.kind === "struct") continue;
        let v = m.get(f.path);
        if (f.kind === "arr") {
            const a = [...v].slice(0, 6).map((x) => typeof x === "number" && !Number.isInteger(x) ? +x.toFixed(3) : x);
            v = `[${a.join(",")}${f.count > 6 ? ",…" : ""}]`;
        } else if (typeof v === "number" && !Number.isInteger(v)) v = +v.toFixed(4);
        parts.push(`${f.path}=${v}`);
        if (parts.length >= 10) { parts.push("…"); break; }
    }
    return parts.join("  ");
}

function pushFeed(topic, who, body, isEvent = false) {
    feed.unshift({ t: now(), topic, who, body, isEvent });
    if (feed.length > 200) feed.pop();
}

function logEvent(e) {
    logs.unshift({ t: now(), text: e.text ?? e.event });
    if (logs.length > 100) logs.pop();
    renderLog();
}

/* ---- topic lifecycle -------------------------------------------------------------- */

async function ensureTopic(name, info) {
    let t = topics.get(name);
    if (!t) {
        t = { ch: null, joining: false, failed: false, info, count: 0, times: [], last: "", lastFrom: "", els: null };
        topics.set(name, t);
    }
    t.info = info ?? t.info;
    if (t.ch || t.joining || t.failed) return;
    t.joining = true;
    try {
        /* pubsub: see the data AND be able to publish; adopt the advertised schema */
        t.ch = await node.channel(name, "pubsub", { adopt: true, catch_up: 1 });
        t.ch.onMessage = (m) => {
            t.count++; t.times.push(performance.now());
            if (t.times.length > 100) t.times.shift();
            t.last = summarize(t.ch, m);
            t.lastFrom = m.senderName || `peer ${m.sender}`;
            pushFeed(name, t.lastFrom, t.last);
        };
    } catch (err) {
        t.failed = true;
        logEvent({ text: `join '${name}' failed: ${err.message}` });
    }
    t.joining = false;
    renderTopics();
}

function rate(t) {
    const cut = performance.now() - 5000;
    const n = t.times.filter((x) => x > cut).length;
    return n ? `${(n / 5).toFixed(n > 25 ? 0 : 1)} Hz` : "";
}

/* aggregate every peer's advertised interest into one topic table */
function aggregateTopics(peers) {
    const agg = new Map();
    for (const p of peers) {
        for (const tp of p.topics ?? []) {
            const a = agg.get(tp.name) ?? { pubs: [], subs: [], reliable: false, hash: null, size: null, fields: null };
            (tp.role === "pub" ? a.pubs : a.subs).push(p.name || `#${p.id}`);
            a.reliable = a.reliable || tp.reliable;
            if (tp.fields) { a.hash = tp.hash; a.size = tp.size; a.fields = tp.fields; }
            agg.set(tp.name, a);
        }
    }
    return agg;
}

/* ---- publish forms ---------------------------------------------------------------- */

function buildForm(t, name) {
    const ch = t.ch;
    const form = document.createElement("div");
    form.className = "form";
    const inputs = [];
    if (ch.fields.size) {
        for (const f of ch.fields.values()) {
            if (f.kind === "struct") continue;
            const label = document.createElement("label");
            label.textContent = `${f.path}: ${f.kind === "arr" ? `${f.elem}[${f.count}]` : f.kind}`;
            const inp = document.createElement("input");
            inp.type = "text";
            inp.placeholder = f.kind === "arr" ? (f.elem === "u8" ? "text or empty" : "1, 2, 3") :
                              f.kind === "bool" ? "true / false" : "0";
            inputs.push([f, inp]);
            form.append(label, inp);
        }
    } else {
        const label = document.createElement("label");
        label.textContent = "payload (text)";
        const inp = document.createElement("input");
        inp.type = "text"; inp.placeholder = "raw bytes as UTF-8 text";
        inputs.push([null, inp]);
        form.append(label, inp);
    }
    const send = document.createElement("button");
    send.className = "send"; send.textContent = "publish";
    send.onclick = () => {
        try {
            if (!ch.fields.size) {
                ch.sendRaw(new TextEncoder().encode(inputs[0][1].value));
            } else {
                const values = {};
                for (const [f, inp] of inputs) {
                    const s = inp.value.trim();
                    if (!s) continue;
                    if (f.kind === "arr") values[f.path] = f.elem === "u8" ? s :
                        s.split(",").map((x) => (f.elem === "u64" || f.elem === "i64") ? BigInt(x.trim()) : Number(x.trim()));
                    else if (f.kind === "bool") values[f.path] = s === "true" || s === "1";
                    else if (f.kind === "u64" || f.kind === "i64") values[f.path] = BigInt(s);
                    else values[f.path] = Number(s);
                }
                ch.send(values);
            }
            pushFeed(name, node.name + " (me)", "published");
        } catch (err) { logEvent({ text: `publish '${name}': ${err.message}` }); }
    };
    form.append(send);
    return form;
}

/* ---- rendering -------------------------------------------------------------------- */

function renderPeers(peers) {
    const el = $("peers");
    if (!peers.length) { el.innerHTML = '<div class="empty">no peers discovered</div>'; return; }
    el.innerHTML = peers.map((p) => `
      <div class="peer ${p.active ? "" : "dropped"}">
        <div class="row1"><span class="dot"></span><span class="pname">${esc(p.name || "?")}</span>
          <span class="meta">#${p.id} ${esc(p.addr)}${p.frag ? ` frag ${p.frag}` : ""}${p.active ? "" : " (dropped)"}</span></div>
        <div class="chips">${(p.topics ?? []).map((t) =>
            `<span class="chip ${t.role}" title="${t.role}${t.reliable ? ", reliable" : ""}"><i></i>${esc(t.name)}</span>`).join("")}
        </div>
      </div>`).join("");
}

function buildCard(name, t) {
    const card = document.createElement("div");
    card.className = "topic";
    const typed = t.ch?.fields.size > 0;
    const head = document.createElement("div");
    head.className = "thead";
    head.innerHTML = `<span class="tname">${esc(name)}</span>
        <span class="badge ${typed ? "typed" : t.failed ? "fail" : ""}">${typed ? `TYPED · ${t.ch.size} B` : t.failed ? "JOIN FAILED" : t.ch ? "RAW" : "JOINING…"}</span>
        ${t.info?.reliable ? '<span class="badge rel">RELIABLE</span>' : ""}
        <span class="badge pubsub"></span>
        <span class="trate"></span>`;
    const last = document.createElement("div");
    last.className = "tlast";
    card.append(head, last);
    if (t.ch) {
        if (typed) {
            const det = document.createElement("details");
            det.innerHTML = `<summary>schema ${t.ch.hash ?? ""}</summary>`;
            const tbl = document.createElement("table");
            tbl.className = "schema";
            tbl.innerHTML = [...t.ch.fields.values()].map((f) =>
                `<tr><td>${"&nbsp;".repeat((f.path.split(".").length - 1) * 2)}${esc(f.path)}</td>
                 <td>${f.kind === "arr" ? `${f.elem}[${f.count}]` : f.kind}</td>
                 <td>@${f.offset}</td><td>${f.size} B</td></tr>`).join("");
            det.append(tbl);
            card.append(det);
        }
        const pub = document.createElement("details");
        pub.innerHTML = "<summary>publish</summary>";
        pub.append(buildForm(t, name));
        card.append(pub);
    }
    return card;
}

function renderTopics() {
    const el = $("topics");
    if (!topics.size) { el.innerHTML = '<div class="empty">no topics discovered yet</div>'; return; }
    el.querySelector(".empty")?.remove();
    for (const [name, t] of topics) {
        /* the card is rebuilt once the join settles (channel created or failed): it is
         * first drawn while the async join is in flight, as a "joining…" placeholder */
        const settled = !!(t.ch || t.failed);
        if (t.els && (t.els.settled || !settled)) continue;
        const card = buildCard(name, t);
        if (t.els) t.els.card.replaceWith(card); else el.append(card);
        const head = card.querySelector(".thead");
        t.els = { card, settled, last: card.querySelector(".tlast"),
                  rate: head.querySelector(".trate"),
                  pubsub: head.querySelector(".pubsub") };
    }
    /* live cells */
    for (const t of topics.values()) {
        if (!t.els) continue;
        t.els.rate.textContent = `${t.count} msgs ${rate(t)}`;
        t.els.pubsub.textContent =
            `${t.info?.pubs.length ?? 0} pub / ${t.info?.subs.length ?? 0} sub`;
        t.els.pubsub.title = `pub: ${t.info?.pubs.join(", ") || "-"}\nsub: ${t.info?.subs.join(", ") || "-"}`;
        t.els.last.innerHTML = t.last
            ? `<span class="from">${esc(t.lastFrom)} ›</span> ${esc(t.last)}`
            : '<span class="from">no data yet</span>';
    }
}

function renderFeed() {
    const el = $("feed");
    if (!feed.length) return;
    el.innerHTML = feed.slice(0, 100).map((r) => `
      <div class="frow ${r.isEvent ? "ev" : ""}"><span class="t">${r.t}</span>
        <span class="top">${esc(r.topic)}</span><span class="who">${esc(r.who)}</span>
        <span class="body">${esc(r.body)}</span></div>`).join("");
}

function renderLog() {
    const el = $("log");
    if (!logs.length) return;
    el.innerHTML = logs.map((r) =>
        `<div class="frow"><span class="t">${r.t}</span><span class="body">${esc(r.text)}</span></div>`).join("");
}

/* ---- refresh loop ----------------------------------------------------------------- */

async function refresh() {
    if (!node) return;
    try {
        const peers = await node.peersSnapshot();
        renderPeers(peers);
        const agg = aggregateTopics(peers);
        for (const [name, info] of agg) ensureTopic(name, info);
        renderTopics();
        renderFeed();
        const s = await node.stats();
        $("stats").textContent =
            `mem ${(s.mem_in_use / 1024).toFixed(0)} KiB · allocs ${s.alloc_calls}` +
            (s.shm_recv !== undefined ? ` · shm ${s.shm_sent}▸ ${s.shm_recv}◂` : "");
    } catch { /* connection died mid-refresh; onClose handles it */ }
}

/* ---- connect ---------------------------------------------------------------------- */

$("connect").onclick = async () => {
    if (node) { node.close(); return; }
    $("connect").textContent = "…";
    try {
        node = await DartClient.connect($("url").value, { name: "debug-ui", max_channels: 64 });
    } catch (err) {
        $("connect").textContent = "connect";
        logEvent({ text: err.message });
        return;
    }
    $("status").classList.add("on"); $("stext").textContent = "connected";
    $("nodename").textContent = node.name;
    $("connect").textContent = "disconnect";
    node.onEvent = (e) => { logEvent(e); if (e.event?.startsWith("peer")) refresh(); };
    node.onClose = () => {
        node = null;
        clearInterval(refreshTimer);
        for (const t of topics.values()) { t.ch = null; t.els = null; t.joining = t.failed = false; }
        topics.clear();
        $("topics").innerHTML = '<div class="empty">no topics discovered yet</div>';
        $("peers").innerHTML = '<div class="empty">not connected</div>';
        $("status").classList.remove("on"); $("stext").textContent = "disconnected";
        $("nodename").textContent = ""; $("stats").textContent = "";
        $("connect").textContent = "connect";
    };
    refreshTimer = setInterval(refresh, 1000);
    refresh();
};

$("addbtn").onclick = () => {
    const name = $("addname").value.trim();
    if (name && node) { ensureTopic(name, null); $("addname").value = ""; }
};
$("addname").onkeydown = (e) => { if (e.key === "Enter") $("addbtn").click(); };
</script>
</body>
</html>
