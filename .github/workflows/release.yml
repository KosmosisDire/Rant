# Cut a release when a tag v<VERSION> is pushed: every package and every program on every
# platform attached to a GitHub Release, the Unity package pushed to the upm branch, and
# the NuGet and the wheels published wherever an API key is set (spec/build.md).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The shared library and the Python wheel per platform, both from cibuildwheel: the
  # library inside each wheel is the one the NuGet and Unity packages bundle too, so on
  # Linux it comes out of the manylinux container and runs on any glibc since 2.28.
  native:
    name: native ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest,   name: macos }
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches VERSION
        shell: bash
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      # aarch64 wheels build under emulation, since no arm runner is free on a private repo.
      - uses: docker/setup-qemu-action@v4
        if: runner.os == 'Linux'
        with:
          platforms: arm64

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: pypa/cibuildwheel@v4.2.1

      - name: The libraries out of the wheels
        shell: bash
        run: |
          python - <<'EOF'
          import glob, os, zipfile
          for w in glob.glob("wheelhouse/*.whl"):
              tag = os.path.basename(w).rsplit("-", 1)[1]
              rid = ("win-x64" if "win_amd64" in tag else "linux-arm64" if "aarch64" in tag
                     else "linux-x64" if "x86_64" in tag else "osx")
              with zipfile.ZipFile(w) as z:
                  for n in z.namelist():
                      if n in ("ramble/ramble.dll", "ramble/libramble.so", "ramble/libramble.dylib"):
                          os.makedirs("dist/native/" + rid, exist_ok=True)
                          with open("dist/native/" + rid + "/" + n[5:], "wb") as f:
                              f.write(z.read(n))
                          print(w, "->", rid)
          EOF
          ls -lR dist/native

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.name }}
          path: dist/native/

  # The explorer, the bridge and the command line tools, one zip per platform. Linux
  # builds on ubuntu-22.04 so the binaries run on glibc 2.35 and newer.
  programs:
    name: programs ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   name: linux-x64 }
          - { os: windows-latest, name: win-x64 }
          - { os: macos-latest,   name: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libdbus-1-dev libudev-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4

      - name: Zip
        shell: bash
        run: |
          mkdir -p out/ramble
          for p in ramble_explorer ramble_bridge demo_scene ramble_test ramble_test_noshm pubsub example pattern_demo if_probe_check; do
            cp "bin/$p" out/ramble/ 2>/dev/null || cp "bin/$p.exe" out/ramble/
          done
          ls out/ramble
          cd out && cmake -E tar cf "../ramble-$(cat ../VERSION)-${{ matrix.name }}.zip" --format=zip ramble

      - uses: actions/upload-artifact@v7
        with:
          name: programs-${{ matrix.name }}
          path: ramble-*.zip

  # Everything into one GitHub Release, the upm branch and the registries.
  release:
    needs: [native, programs]
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Before the platform artifacts land in the tree, so the sdist is the source alone.
      - name: Source distribution
        run: |
          python -m pip install build
          python -m build --sdist -o wheelhouse

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Merge the platforms
        run: |
          mkdir -p dist/native
          cp -r artifacts/native-*/. dist/native/
          cp artifacts/wheels-*/*.whl wheelhouse/
          ls -R dist/native wheelhouse

      - name: NuGet package
        run: dotnet pack csharp/Ramble.csproj -c Release -o dist

      - name: Unity package
        run: cmake -P tools/unity.cmake

      - name: Stage the assets
        run: |
          VERSION="$(cat VERSION)"
          mkdir -p release
          cp dist/ramble.h dist/ramble_discovery.h dist/ramble_transport.h dist/ramble.c dist/ramble.hpp dist/ramble.cpp release/
          cp dist/ramble.mjs dist/ramble.js dist/ramble.d.ts release/
          cp dist/Ramble.*.nupkg dist/ramble-*.unitypackage wheelhouse/* artifacts/programs-*/*.zip release/
          (cd dist && cmake -E tar cf "../release/ramble-$VERSION-native.zip" --format=zip native)
          ls -la release

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

      # The Unity package as a git URL: https://github.com/OWNER/REPO.git#upm
      - name: Publish the upm branch
        run: |
          pkg="$RUNNER_TEMP/upm"
          rm -rf "$pkg"
          cp -r dist/com.rant.ramble "$pkg"
          cd "$pkg"
          git init -q -b upm
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "upm $(cat "$GITHUB_WORKSPACE/VERSION")"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" upm

      # Set NUGET_API_KEY and PYPI_API_TOKEN as repository secrets and the next tag
      # publishes. Without them the release is the GitHub page alone.
      - name: Publish to nuget.org
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "dist/Ramble.*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheelhouse
