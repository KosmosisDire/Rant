# Build every DART distributable and attach them to a GitHub Release when a tag is pushed.
# Single-file distributables (C headers, C++ header, Python module, the NuGet .nupkg) are
# uploaded as-is; anything made of multiple files (the Unity package) is zipped.
#
# Assets:
#   dart.h  dart_discovery.h  dart_transport.h   (C single-headers)
#   dart.hpp                                      (C++ wrapper)
#   dart.py                                       (Python wrapper)
#   Dart.<version>.nupkg                          (C# NuGet: managed + win-x64 + linux-x64 native)
#   dart-<version>.unitypackage                   (Unity: Dart.cs + native plugins -> Assets/Dart/)
name: release

on:
  push:
    tags: ['*']            # any tag you push cuts a release

permissions:
  contents: write          # create the release + upload assets (uses GITHUB_TOKEN, no PAT)

jobs:
  # ---- native libraries (one per platform, run in parallel) -------------------
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build linux-x64 native lib
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDART_BUILD_TOOLS=OFF -DDART_BUILD_EXPLORER=OFF -DDART_BUILD_BRIDGE=OFF
          cmake --build build --target dart_shared
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/native/linux-x64/libdart.so

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build win-x64 native lib
        run: |
          cmake -S . -B build -DDART_BUILD_TOOLS=OFF -DDART_BUILD_EXPLORER=OFF -DDART_BUILD_BRIDGE=OFF
          cmake --build build --config Release --target dart_shared
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: dist/native/win-x64/dart.dll

  # ---- pack everything + publish the release ----------------------------------
  release:
    needs: [native-linux, native-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place native libs
        run: |
          mkdir -p dist/native/win-x64 dist/native/linux-x64
          cp artifacts/native-windows/dart.dll   dist/native/win-x64/dart.dll
          cp artifacts/native-linux/libdart.so   dist/native/linux-x64/libdart.so

      - name: Pack NuGet (managed + both native RIDs)
        run: dotnet pack csharp/Dart.csproj -c Release -o nupkg -p:Version="${GITHUB_REF_NAME#v}"

      - name: Assemble Unity package
        run: sh csharp/unity/pack.sh            # copies Dart.cs + native libs into csharp/unity/Runtime/

      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp dist/dart.h dist/dart_discovery.h dist/dart_transport.h dist/dart.hpp dist/dart.py release/
          cp nupkg/Dart.*.nupkg release/
          sh csharp/unity/mk-unitypackage.sh "release/dart-$VERSION.unitypackage"
          ls -la release/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      # Publish the assembled Unity package (Dart.cs + native plugins at the branch root)
      # to a dedicated `upm` branch so it can be added via a UPM git URL:
      #   https://github.com/OWNER/REPO.git#upm
      # main stays binary-free; only this generated branch carries the compiled libs.
      - name: Publish upm branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pkg="$RUNNER_TEMP/upm"
          sh csharp/unity/mk-upm.sh "$pkg"   # tree + a .meta per file/folder (immutable pkg cache needs them)
          cd "$pkg"
          git init -q -b upm
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "upm $VERSION"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" upm
