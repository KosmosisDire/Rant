# Build Ramble on every push and pull request, on the three desktop platforms.
#
# The test suites are deliberately not run here yet. The test rework lands first and the
# suites (bin/ramble_test selftest, cpp/test.cpp, csharp/test, python/test.py) get wired in
# after it, so a red build here means a build broke, never a flaky network leg.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest,   name: macos }

    steps:
      - uses: actions/checkout@v7

      # The explorer and the bridge fetch SDL3, IXWebSocket and libdatachannel, and both
      # are moving out of this repo, so CI covers the library and its own programs.
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAMBLE_BUILD_EXPLORER=OFF -DRAMBLE_BUILD_BRIDGE=OFF
          cmake --build build --config Release --parallel 4

      # A hand edited dist/ header is the one thing the amalgamator cannot catch itself.
      # .gitattributes pins the committed form to LF, so this is clean on every platform.
      - name: dist matches src
        run: |
          cmake -P tools/pack.cmake
          git diff --exit-code -- dist/

      # The CPM and FetchContent path: a consumer writes no anchor and defines nothing.
      - name: A consumer builds from source
        run: |
          cmake -S tools/consumer -B build/consumer -DCMAKE_BUILD_TYPE=Release
          cmake --build build/consumer --config Release

      - name: A consumer builds from an install
        run: |
          cmake --install build --prefix "${{ runner.temp }}/prefix"
          cmake -S tools/consumer -B build/findpkg -DCMAKE_BUILD_TYPE=Release -DRAMBLE_CONSUMER_FIND_PACKAGE=ON -DCMAKE_PREFIX_PATH="${{ runner.temp }}/prefix"
          cmake --build build/findpkg --config Release

      # The build above already made the shared library. This is where the packages read it.
      - name: Shared library
        shell: bash
        run: ls -l dist/native/*/

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: NuGet package
        run: dotnet pack csharp/Ramble.csproj -c Release -o dist

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python wheel
        run: python -m pip wheel . --no-deps -w dist
