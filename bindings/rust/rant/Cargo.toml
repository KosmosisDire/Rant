[package]
name = "rant-middleware"
description = "Rant: robotics networking middleware, discovery, topics, functions, tasks and variables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "rant"
build = "build.rs"
include = ["src/**", "csrc/rant.h", "csrc/rant.c", "build.rs", "dist.rs", "Cargo.toml"]

[lib]
name = "rant"

[dependencies]
rant-macros = { path = "../rant-macros", version = "=0.0.27" }

[build-dependencies]
cc = "1.2"
