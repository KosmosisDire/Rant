[workspace]
members = ["rant", "rant-macros", "rant-types", "ffigen", "../../tests/interop/rust"]
# ffigen needs libclang and the interop tick is ctest's, so a plain cargo build leaves them out
default-members = ["rant", "rant-macros", "rant-types"]
resolver = "3"

[workspace.package]
version = "0.0.41"
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Shield-1.0.0"
repository = "https://github.com/KosmosisDire/Rant"
