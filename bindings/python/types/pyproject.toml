# The standard types alone, with no native code, so Rant and a library such as Rant Math share one
# definition of each. The package is ../rant_types, whose classes rant_codegen writes.
[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "rant-types"
dynamic = ["version"]
description = "The standard types of Rant, such as Pose, Image and PointCloud, with no middleware."
requires-python = ">=3.9"
keywords = ["robotics", "types", "rant"]
authors = [{ name = "Nathan George" }]

[project.urls]
Homepage = "https://github.com/KosmosisDire/Rant"

[tool.scikit-build]
wheel.cmake = false
wheel.packages = ["../rant_types"]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "../../../VERSION"
metadata.version.regex = "(?P<value>[0-9.]+)"
